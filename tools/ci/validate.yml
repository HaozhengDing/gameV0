# 模板：复制为 .github/workflows/validate.yml 后生效
# 原因：当前推送凭据没有 workflow scope，无法直接推送 .github/workflows/。
name: validate-data
on:
  push:
  pull_request:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install deps
        run: pip install pyyaml
      - name: Validate data and cards
        run: python tools/validate_data.py
