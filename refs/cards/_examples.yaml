# 示例角色卡 v0.2 —— 己方 / 敌方 / NPC / 规则实体各一张
# 字段定义见 refs/README.md

- type: character
  id: C-0001
  source: {work: 道诡异仙, author: 狐尾的笔, medium: webnovel}
  logline: 一个分不清现实与幻觉的大学生，在两个世界之间求生。
  world_arch:
    system: 双世界（现代都市 / 诡异修仙）+ 司命-天道神系
    position: 规则之外，被多方争夺的「容器」
  identity:
    name: 李火旺
    alias: [火旺]
    title: 心素
    job: 大学生 / 精神病患者
    faction: 无固定阵营
    era_place: 现代都市 + 诡异修仙世界
    relations: [丹阳子（名义师父）, 坐忘道（敌对骗徒组织）]
  visual_voice:
    visual: 病号服 / 道袍 / 血
    voice: 耳鸣、心跳、诵经；说话忽快忽慢，常有停顿
  psyche:
    desire: 活下去，弄清哪个世界是真的
    fear: 分不清真假，被当成疯子
    secret: 他的「幻觉」可能比现实更真
    morality: 灰
    bottom_line: 不主动害人（但常常做不到）
  power:
    abilities: 心素体质——感知别人看不到的东西，被各方觊觎
    cost: 认知污染、身体损害、身边人不断死去
    trigger: 接触异常物 / 情绪剧烈波动
    combat: 弱
  game_function:
    side: player
    function: [fate, narrative]
    spawn: 开局到终局（常驻）
    interaction: 玩家操作
    reward: 解锁「心素」命格与污染可视化
    recurrence: 常驻
    threat: 2
    variants: [心素（看见真相）, 心浊（看见谎言）, 无面（失去身份）]
  mechanic_map:
    map: [fate, pollution]
    one_liner: 污染越高，UI 文本与物品描述越会说谎
    adapt_score: 5
    reason: 直接把「不可靠叙述」变成界面机制，低成本高辨识度
  voice_lines:
    - 「你们都说我疯了……可疯子怎么会看见你？」
    - 「别过来。我不知道你是真的，还是我又犯病了。」
    - 「如果这两个世界只能留一个，我希望是那个人少一点的世界。」
  naming:
    structure: 普通姓氏 + 土气本名，再给一个概念化称号
    chars: 火、旺、土、骨
    new_names: [沈渡, 宋无咎, 柳三更]
    avoid: 不要直接用「心素」以外的原著名
  meta:
    tags: [webnovel, cognition, vessel, pollution, fate]
    status: analyzed
    risk: 版权（小说改编权）；同质化
    sources: [http://www.chinawriter.com.cn/n1/2023/0824/c404027-40063013.html]
    updated: 2026-11-13

- type: character
  id: C-0002
  source: {work: 道诡异仙, author: 狐尾的笔, medium: webnovel}
  logline: 自称丹阳子的邪道修士，把徒弟当成成仙的祭品。
  world_arch:
    system: 修仙界的「成仙」体系
    position: 体制边缘的掠食者，靠吃人往上爬
  identity:
    name: 丹阳子
    title: 丹阳子（道号）
    job: 邪道修士 / 名义上的师父
    faction: 散修（无门无派）
    era_place: 诡异修仙世界
    relations: [李火旺（徒弟/祭品）, 坐忘道（互相利用）]
  visual_voice:
    visual: 脏道袍、药炉、血手
    voice: 温和、絮叨，越说越不对劲
  psyche:
    desire: 成仙（长生）
    fear: 死，或者「成不了仙」
    secret: 他的「成仙」需要徒弟的命
    morality: 恶，但自洽
    bottom_line: 没有底线
  power:
    abilities: 道术、炼丹、夺舍
    cost: 身体败坏，靠丹药与活人维持
    trigger: 成仙仪式 / 传功
    combat: 中
  game_function:
    side: hostile
    function: [mentor, gatekeeper, boss]
    spawn: 中期（第一座道观）
    interaction: 试炼 → 反目
    reward: 成仙线索、功法残页
    recurrence: 一次性
    threat: 4
    variants: [假师父, 假神医, 假道长]
  mechanic_map:
    map: [fate, rule]
    one_liner: 前 30 分钟教你机制的导师，后面拿你当祭品
    adapt_score: 5
    reason: 假导师是「信任即代价」的最佳载体
  voice_lines:
    - 「徒儿，修行第一步，是先学会疼。」
    - 「为师不是要你的命，是要你成全为师的命。」
    - 「你看，成仙的路，从来都是一条人命铺一条。」
  naming:
    structure: 元素 + 字 + 子（道号）
    chars: 丹、阳、玄、枯、烬
    new_names: [玄枯子, 丹烬子, 守默子]
    avoid: 不要复用「丹阳子」
  meta:
    tags: [webnovel, body, folk, boss, mentor]
    status: analyzed
    risk: 版权
    sources: [http://www.chinawriter.com.cn/n1/2023/0824/c404027-40063013.html]
    updated: 2026-11-13

- type: character
  id: C-0003
  source: {work: 还愿, author: 赤烛游戏, medium: game}
  logline: 被私坛供奉的「私佛」，它答应你的一切，都要连本带利还回去。
  world_arch:
    system: 私坛神系（正神借壳 + 交易）
    position: 规则实体，无法被常规战斗杀死
  identity:
    name: 慈孤观音
    alias: [私佛]
    job: 神像 / 显灵者
    faction: 慈孤坛（何老师）
    era_place: 1980 年代台湾
    relations: [何老师（坛主）, 杜丰于（信众）]
  visual_voice:
    visual: 神像、红布、香灰、暗室
    voice: 木鱼、诵经、低语
  psyche:
    desire: 香火、供奉、还愿
    fear: 无人供奉
    secret: 「还愿」真正的代价，信众永远不知道
    morality: 非人，无善恶
    bottom_line: 只认契约
  power:
    abilities: 显灵、治病、附身——一切都要交易
    cost: 供奉者付出家人、身体与记忆
    trigger: 上香 / 许愿 / 还愿
    combat: 不可战斗
  game_function:
    side: rule-entity
    function: [rule, boss]
    spawn: 终局（祠堂/私坛区域）
    interaction: 献祭 / 还愿 / 遵守禁忌
    reward: 真相碎片、诅咒
    recurrence: 一次性
    threat: 5
    variants: [私佛, 家神, 邪神]
  mechanic_map:
    map: [rule, pollution]
    one_liner: 打不过，只能按它的规矩「还愿」；违反禁忌触发事件
    adapt_score: 5
    reason: 完美的「规矩型 BOSS」，直接对应规则怪谈式引导
  voice_lines:
    - 「许愿要还的。」
    - 「你拿什么换，我都收。」
    - 「你拜了，就算数。」
  naming:
    structure: 正神词 + 扭曲修饰（慈悲/孤独/观音）
    chars: 慈、孤、母、佛、神、娘娘
    new_names: [赤瞳娘娘, 无面佛, 空肚神]
    avoid: 不要复用「慈孤观音」
  meta:
    tags: [game, rule, folk, rule-entity, contract]
    status: analyzed
    risk: 宗教敏感；版权（赤烛）
    sources: [https://www.marieclaire.com.tw/lifestyle/whats-hot/40929]
    updated: 2026-11-13

- type: character
  id: C-0004
  source: {work: 还愿, author: 赤烛游戏, medium: game}
  logline: 慈孤坛的坛主，卖的不是神迹，是希望。
  world_arch:
    system: 私坛神系
    position: 体制外的商人，把神当生意
  identity:
    name: 何老师
    title: 何老师（尊称）
    job: 神棍 / 坛主
    faction: 慈孤坛 / 陆心青年会
    era_place: 1980 年代台湾
    relations: [慈孤观音（供奉对象）, 杜丰于（客户）]
  visual_voice:
    visual: 西装、佛珠、坛前香火
    voice: 温和、笃定、永远有答案
  psyche:
    desire: 钱与权
    fear: 被揭穿
    secret: 他知道的比说出来的多
    morality: 恶
    bottom_line: 只要不被抓，什么都可以卖
  power:
    abilities: 话术、仪式、心理操控
    cost: 无（代价由信众承担）
    trigger: 信众走投无路
    combat: 无
  game_function:
    side: npc
    function: [trade, quest, intel]
    spawn: 前中期（村镇）
    interaction: 对话 / 交易 / 委托
    reward: 假道具、半真半假的线索
    recurrence: 反复出现
    threat: 1
    variants: [神棍, 气功大师, 保健品推销员]
  mechanic_map:
    map: [narrative, rule]
    one_liner: 提供假情报，污染玩家的判断与笔记
    adapt_score: 4
    reason: 让「不可靠的 NPC」成为信息污染源
  voice_lines:
    - 「信则有，不信……也有。」
    - 「你女儿的病，医院治不了，我能。」
    - 「钱的事好说，先上香。」
  naming:
    structure: 职业 + 尊称（何老师）
    chars: 师、老师、先生、居士
    new_names: [白先生, 柳居士, 陈师傅]
    avoid: 不要复用「何老师」
  meta:
    tags: [game, family, folk, npc, trade]
    status: analyzed
    risk: 宗教敏感；版权
    sources: [https://www.marieclaire.com.tw/lifestyle/whats-hot/40929]
    updated: 2026-11-13

- type: character
  id: C-0005
  source: {work: 双瞳, author: 陈国富, medium: film}
  logline: 一对双胞胎修行者，把整座城市当成渡劫的祭坛。
  world_arch:
    system: 道教成仙/渡劫体系
    position: 仪式执行者，规则内的「修行者」
  identity:
    name: 谢亚理
    title: 真仙观修行者
    job: 修行者 / 真菌容器
    faction: 真仙观（交阯道派）
    era_place: 2002 台北
    relations: [双胞胎姐妹（共生）, 黄火土（调查者）]
  visual_voice:
    visual: 双瞳、道观、霉菌、水
    voice: 诵经、金属珠滚动
  psyche:
    desire: 完成渡劫、成仙
    fear: 渡不过去
    secret: 成仙需要别人的命
    morality: 非人逻辑
    bottom_line: 为了飞升，什么都可以
  power:
    abilities: 道教成仙术 + 真菌/幻觉
    cost: 身体损坏，靠真菌与献祭维持
    trigger: 渡劫仪式
    combat: 中
  game_function:
    side: hostile
    function: [event, boss]
    spawn: 中期（道观区域）
    interaction: 战斗 / 干扰仪式
    reward: 成仙术残页、真菌样本
    recurrence: 一次性
