- type: character
  id: C-0001
  name: 李火旺
  alias: [火旺]
  source: {work_id: W-0001, title: 道诡异仙, author: 狐尾的笔, medium: webnovel}
  identity: 大学生 / 精神病患者 / 心素持有者
  affiliation: 无固定阵营（被多方争夺）
  era_place: 现代都市 + 诡异修仙世界
  story_role: protagonist
  anomaly_relation: vessel
  desire: 活下去，弄清哪个世界才是真的
  fear: 分不清现实与幻觉，被当成疯子
  secret: 他的「幻觉」可能比现实更真（不可靠叙述）
  ability: 心素体质——所见所闻会反噬，也会被他人觊觎
  cost: 认知污染、身体损害、身边人不断死去
  signature: 在精神病院与修仙世界之间来回「跳」
  visual_motif: [医院白墙, 道袍, 血]
  audio_motif: [耳鸣, 诵经, 心跳]
  transferable: 命格「心素」：开局能看到别人看不到的东西；污染高时 UI 文本说谎
  adapt_score: 5
  risk: 版权（小说改编权）
  tags: [webnovel, cognition, vessel, fog, "system_map:fate", "system_map:pollution"]
  sources: [http://www.chinawriter.com.cn/n1/2023/0824/c404027-40063013.html]
  status: analyzed
  updated: 2026-11-13
  lesson: 不可靠叙述可以做成「界面会说谎」的机制，而不是只做剧情。

- type: character
  id: C-0002
  name: 谢亚理
  alias: []
  source: {work_id: W-0002, title: 双瞳, author: 陈国富, medium: film}
  identity: 双胞胎姐妹（幸存者）/ 真仙观修行者 / 「成仙」容器
  affiliation: 真仙观
  era_place: 2002 台北
  story_role: antagonist
  anomaly_relation: sacrifice
  desire: 完成渡劫、成仙
  fear: 渡劫失败、无法离开这一世
  secret: 所谓成仙，需要他人性命与一场献祭
  ability: 道教成仙术 + 真菌/幻觉（霉菌钢珠）
  cost: 身体损坏，靠他人性命与真菌维持
  signature: 道观里的「飞升」，与刑警黄火土的最后对峙
  visual_motif: [双瞳, 道观, 霉菌, 水]
  audio_motif: [诵经, 金属珠滚动]
  transferable: BOSS「渡劫者」：她要在你身上完成仪式，不能硬打，只能破它的规矩
  adapt_score: 4
  risk: 版权（电影）；宗教表达敏感
  tags: [film, body, folk, antagonist, sacrifice, temple, "system_map:rule"]
  sources: [https://movie.douban.com/review/9332301/]
  status: analyzed
  updated: 2026-11-13
  lesson: 反派不需要「邪恶」，她只需要一个自洽的成仙逻辑，恐怖就成立了。

