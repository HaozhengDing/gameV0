- type: character
  id: C-0006
  source: {work: 动物园规则怪谈, author: phKeaLx, medium: rules-horror}
  logline: 一个「会走路的规则」：他检查的不是你，是你有没有按规则做事。
  world_arch:
    system: 规则空间（同一园区多套规则层）
    position: 规则执行者（他自己也在规则里）
  identity:
    name: 动物园员工
    title: 员工 / 夜班保安 / 讲解员（按区域变化）
    job: 规则执行
    faction: 动物园
    era_place: 规则空间，时代不明
    relations: [游客（检查对象）, 「它」（真正的管理者）]
  visual_voice:
    visual: 制服、工牌、手电、微笑
    voice: 背诵式、礼貌到不正常
  psyche:
    desire: 维持规则运行
    fear: 自己违反规则
    secret: 他也不知道规则是谁定的
    morality: 中立
    bottom_line: 只执行文本，不解释
  power:
    abilities: 检查、纠正、驱逐
    cost: 违规会被「它」处理
    trigger: 游客违反规则
    combat: 不可战胜
  game_function:
    side: rule-entity
    function: [rule, gatekeeper]
    spawn: 每层入口 / 检查点
    interaction: 检查票据 / 提问 / 给出规则
    reward: 通行 / 惩罚 / 新规则
    recurrence: 反复出现
    threat: 3
    variants: [保安, 导游, 水族馆讲解员, 保洁]
  mechanic_map:
    map: [rule]
    one_liner: 他是会走路的规则；你要在他面前做对
    adapt_score: 5
    reason: 把教程/引导拟人化成检查者，最贴我们的「规矩」系统
  voice_lines:
    - 「请出示您的门票。……谢谢，祝您游玩愉快。」
    - 「根据员工手册第 7 条，您不能在这里停留。」
    - 「您看见的东西，请当作没有看见。」
  naming:
    structure: 机构文本 + 岗位名（游客指南/员工手册/讲解员）
    chars: 指南、守则、须、止、勿
    new_names: [夜巡须知, 渡口守则, 拾骨人契]
    avoid: 不要复用「动物园」原文
  meta:
    tags: [rules-horror, rule, rule-entity, urban]
    status: analyzed
    risk: 版权（原作）；「怪谈」二创需谨慎
    sources: [http://www.chinawriter.com.cn/n1/2024/0514/c404027-40235528.html]
    updated: 2026-11-13
