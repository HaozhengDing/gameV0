# P0 符箓卡（F）——4 组可玩的符组
# 符 = 符头 + 符胆 + 符脚；这里以「一组常用组合」为单位做卡，方便直接上手。
# 数值暂定，对齐设计文档 3.3（灵力：飞剑5/毕方火10/鬼火8/五雷40；符头+3/+5；符脚+8~+30）。

- type: talisman
  id: F-0001
  name: 斩 + 爆
  kind: 符组（攻击）
  tier: T1
  segments:
    符头: 无（可自由插入 急急如律令 / 天罡）
    符胆: 斩（金，伤害 8，穿透 1）
    符脚: 爆（火，爆炸 15，半径 20）
  elements: [金, 火]
  numbers: {spirit_cost: 13, damage_single: 23, damage_splash: 15, radius: 20, cooldown: "法器决定"}
  effect: 单体穿透 + 落点小范围爆炸；打中煤/硝/瓦斯会引发二次反应。
  counter: 被土系盾/陶俑减伤；对木系目标引燃。
  combo_ideas:
    - 天罡 + 斩 + 爆：伤害 ×1.2，灵力 +3
    - 敕·触 + 斩 + 爆：碰撞即爆，适合陷阱
  numbers_note: "23 伤 = 8 单体 + 15 爆炸；原型期够小怪 2 发"
  design_ref: [1.3 符箓系统, 3.3 符与法器数值模型]
  deviations:
    - "2026-11-20 精简命名：原「飞剑·煞」改为按组成显示「斩 + 爆」（去中二词；急急如律令等明确道教符语保留，见 refs/naming.md §5）。"
  status: draft

- type: talisman
  id: F-0002
  name: 火 + 化水
  kind: 符组（控制/地形）
  tier: T2
  segments:
    符头: 无
    符胆: 火（火，10 + 燃烧）
    符脚: 化水（命中物质 → 水）
  elements: [火, 水]
  numbers: {spirit_cost: 40, damage: 10, burn_dps: 3, duration: 3}
  effect: 点燃目标后把它接触的物质转化成水；可灭火、造水、为导电做准备。
  counter: 对旱魃是双重克制（水克火）；但对水府敌人可能送水。
  combo_ideas:
    - 火 + 化水 + 五雷（40 灵）：先造水再导电，范围伤害
    - 火 + 化水 后接 阴 + 镇：水地定身
  numbers_note: "40 灵是 T2 门槛，原型期测「值不值」"
  design_ref: [1.3 符箓系统, 1.6 五行物质系统]
  deviations:
    - "2026-11-20 精简命名：原「毕方火·化·水」改为「火 + 化水」（去神兽修饰与合体名）。"
  status: draft

- type: talisman
  id: F-0003
  name: 阴 + 镇
  kind: 符组（控制/夺魄）
  tier: T2
  segments:
    符头: 无
    符胆: 阴（阴，熄灯 0.3 盏/次，不伤气血）
    符脚: 镇（定身 1.5 秒）
  elements: [阴]
  numbers: {spirit_cost: 20, yin_damage: 0.3, stun: 1.5, cooldown: "法器决定"}
  effect: 不杀身，只夺魄 + 定身；对「杀不死」的东西（规则实体/怨灵）也有效。
  counter: 对阳间活物收益低；对阴间敌人/怨灵收益高。
  combo_ideas:
    - 阴 + 镇 + 爆：先定身再爆
    - 阴 + 镇 + 吸：夺魄同时回血（阴路线）
  numbers_note: "0.3 盏/次 → 约 4 次熄一盏；原型验证「夺魄是否可感知」"
  design_ref: [1.3 符箓系统, 1.4 三魂七魄]
  deviations:
    - "2026-11-20 精简命名：原「鬼火·镇」改为「阴 + 镇」（保留「镇」，去冗词）。"
  status: draft

- type: talisman
  id: F-0004
  name: 掘 + 归
  kind: 符组（探索/回灵）
  tier: T1
  segments:
    符头: 无
    符胆: 掘（土，挖掘/位移）
    符脚: 归（回灵，返还 8 灵力）
  elements: [土]
  numbers: {spirit_cost: 10, refund: 8, dig_speed: "1 格/0.4 秒", net: 2}
  effect: 挖掘并位移；结束后返还灵力，是「探索自循环」的钥匙。
  counter: 挖到瓦斯/水银/塌方区会触发危险；不能在岩层连续用。
  combo_ideas:
    - 掘 + 归 + 爆：挖进敌群中心后爆
    - 掘 + 归 反复用：原型期验证「探索是否也消耗资源」
  numbers_note: "净耗 2 灵，原型期防止无限挖"
  design_ref: [1.3 符箓系统, 1.6 五行物质系统]
  deviations:
    - "2026-11-20 精简命名：原「土遁·归」改为「掘 + 归」（保留「归」，去网文词「土遁」）。"
  status: draft
