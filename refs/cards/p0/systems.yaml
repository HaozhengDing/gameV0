# P0 系统卡（S）——《刍狗》原型第一批
# 数值均为占位，用于验证手感；后续统一调参。
# 设计依据：docs/design/刍狗_概念设计v0.1_原文.md（《刍狗》概念设计 v0.1）；路线决策见 docs/01-decision-twist.md

- type: system
  id: S-0001
  name: 核心循环
  version: v0
  purpose: 把「下潜—组合—死亡—祠堂」闭环压到 15 分钟可跑通，用来验证「符箓 × 物质反应」是否好玩（规矩只是关卡的叙事规则层，见 docs/01-decision-twist.md D2）。
  loop: 山门出发 → 下潜一层（探索/拾取/战斗）→ 洞天（传法/鬼市/丹炉/纸扎铺/香案）→ 第 3 层起可走鬼门进阴面 → 归墟 → 混沌/结局；死亡 → 祠堂记录死因与牌位。
  numbers:
    single_run: 30–90 分钟（原型版 15 分钟）
    layers: 0–7（原型只做 0–1 层）
    income_per_layer: "300 + 180 × (L-1) 银（线性；数值源 data/magic_numbers.json economy）"
    wand_price: "250 + 150 × (L-1) 银（线性，恒为当层收入的 5/6）"
    kill_time: 小怪 2–5 发解决
  rules:
    - 世界本身是最大的敌人，不是怪堆
    - 死亡只带走知识（图鉴/死因/秘密），不带走数值
    - 神智归零不是 Game Over，是可进出的入魔状态（S-0004）
    - 阴面是另一条路，不是第二个关卡
  metrics:
    - 30 秒内理解「我该往下走」
    - 15 分钟内至少经历一次「符组合生效」的爽点
    - 死亡后能说出「我死于什么规则/什么组合」
  risks:
    - 循环太长，单局验证成本高
    - 死亡惩罚（知识带入）在原型阶段反馈太慢
  open_questions: [原型先做几层, 是否保留严格永久死亡]
  design_ref: [1.2 核心循环, 1.8 元进度]
  deviations:
    - 每层收入由原指数公式 300 × 1.5^(L-1)（7 层约 3400 银，会迫使商店价格同步指数化）改为线性 300 + 180 × (L-1)；复议条件 = 第 4 层做出来之后。
    - 法器价由 250 × 1.6^(L-1) 改为线性 250 + 150 × (L-1)，与收入同步；原指数价第 7 层约 4194，是当层收入的 3 倍。复议条件同上。
  status: draft

- type: system
  id: S-0002
  name: 符箓系统（法器 + 三段式）
  version: v0
  purpose: 本作的核心决策空间：用「符头/符胆/符脚」拼一句法术，打在会反应的五行物质上。
  structure:
    法器: 灵力上限 / 回灵 / 符位 / 每念几符 / 施法间隔 / 回符时间 / 散布 / 成文·散符
    符头: 修饰或触发（急急如律令、敕·触、奉·时、天罡、分身）
    符胆: 主体（飞剑、毕方火、五雷、鬼火、墨弹、藤生、土遁）
    符脚: 命中/结束载荷（煞、化·水、化·金、镇、噬、归、散、返）
  numbers:
    mana_max: "50 + 30×L"
    mana_regen: "10 + 8×L / 秒"
    slots: "2–24（原型 4）"
    cast_interval: "0.50→0.02 秒"
    head_cost: "+3 或 +5 灵力"
    foot_cost: "+8 ~ +30 灵力"
    forbidden: "禁符任何时候可念；念出立即 −20 神智，下一次施法整次变为幻符（反噬，见 S-0004）"
  rules:
    - 符头累积成施法状态，遇符胆生成投射物，其后连续符脚附着
    - 一句读完按「每念几符」决定读几句；乱序法器随机抽句
    - 五行只作用于物质生成、反应匹配与符胆视听主题，不进伤害公式（见 S-0003）
    - 禁符随时可念，代价落在神智与下一次施法——力量导致疯狂（见 S-0004）
    - 普通施法不扣神智；神智只在禁符、禁书、目睹、阴面四处流失（docs/01-decision-twist.md D3）
  open_questions: [符箓 VM 的形式语义, 灵力资源上限, 乱序是否保留]
  design_ref: [1.3 符箓系统, 3.3 符与法器数值模型]
  deviations:
    - 删除五行伤害乘数（相克 ×1.5 / 被克 ×0.6 / 相生喂养）；理由与复议条件见 S-0003。
    - 删除「禁符要求神智 < 33 才能念」；改为随时可念 + −20 神智 + 下一次施法反噬为幻符；理由见 S-0004。
  status: draft

- type: system
  id: S-0003
  name: 五行物质系统
  version: v0
  purpose: 用一套可读的物质反应表，让「打哪儿/用什么打」通过物质反应产生意义。
  materials:
    液体: [水, 桐油, 酒, 血, 墨, 水银, 尸水, 漆, 蜂蜜]
    粉末: [沙, 煤, 硝石, 硫磺, 朱砂, 石灰, 香灰, 糯米, 盐, 雄黄, 纸钱]
    固体: [岩, 玉, 铁, 金, 陶, 竹木, 雷击木, 桃木, 冰]
    气体: [阴气, 瘴气, 煞气, 龙气, 蒸汽, 硫烟]
    特殊: [蛊（虫群）, 太岁（可再生肉质）]
  reaction_table:
    - {a: 硝石, b: [硫磺, 炭, 火], result: 黑火药爆炸, damage: 25, radius: 40}
    - {a: 石灰, b: 水, result: 放热蒸汽, damage: 5, radius: 25}
    - {a: 糯米, b: 尸气, result: 净化, effect: 移除阴气}
    - {a: 黑狗血, b: 鬼, result: 灼伤, damage: 20}
    - {a: 水银, b: 旧日之物, result: 无法越过, effect: 形成边界}
    - {a: 朱砂, b: [墨, 纸], result: 现场画符, effect: 临时符位 +1}
    - {a: 火, b: 瓦斯, result: 矿井爆炸, damage: 60, radius: 80}
    - {a: 阴火, b: 普通水, result: 阴火不灭, effect: 水变阴水}
  numbers:
    simulate_budget: "1080p 60fps，单屏活跃粒子 ≤ 8000"
    material_types: "首批 12 种，反应 8 条"
  rules:
    - 先小后大：首批只做 12 种物质，能读懂比真实重要
    - 反应必须一眼可读（颜色/声音/文字提示三选二）
    - 五行标签只用于物质生成分布、反应匹配、符胆视听主题；不进伤害公式
  open_questions: [逐像素 vs 网格, 性能上限, 反应表谁来写]
  design_ref: [1.6 五行物质系统]
  what: element 字段仅用于三件事——物质生成分布、反应表匹配条件、符胆视觉/音效主题。**不进入伤害公式。**
  why: 现有 8 条反应（data/materials.json）全部靶向具体物质或实体标签，无一依赖抽象克制；「相克增强」由反应表直接表达（例：火符打木材 → 引燃范围扩大），不需要第二套数值系数。
  cost: "失去「看标签即知弱点」的即时反馈；补偿为敌人直接写 `weak_to: [具体物质]`，而非五行（例：旱魃 weak_to: [water, yin_qi]）。"
  deviations:
    - 原 v1 五行伤害乘数（相克 ×1.5 / 被克 ×0.6 / 相生喂养）已删除；复议条件 = 原型跑通后玩家反馈五行感不足。
  status: draft

- type: system
  id: S-0004
  name: 三魂七魄 + 命格（开局 build）
  version: v0
  purpose: 让「身体/精神」是两个独立资源，并把开局命格做成 build 身份而不是数值碾压。
  resources:
    七魄: 气血 100，UI 为七星灯；阴性伤害直接熄灯，每熄一盏气血上限 -1/7
    三魂: 神智 0–100，三段阈值 + 归零（见 sanity_tiers）
  sanity_tiers:
    "≥66": 完好
    "33–65": 失爽灵——未知信息腐坏：未鉴定物品描述、碑文、地图标记出现错字与假条目；已学会的符名、法器属性、反应提示不受影响
    "<33":
      - 失胎光——地图消失、幻觉敌人（有些是真的）
      - 每次施法 15% 概率将本次符胆替换为随机「幻符」（效果取自同层敌人符池，仍消耗灵力）
      - 符位中随机 1 格被「幻影符」占据（读到时视为空位），不可移除，直到神智回到 ≥33
    "0": 失幽精——入魔（可逆，见 possession）
  numbers:
    lanterns: 7
    hp: 100
    sanity: 100
    yin_damage_per_hit: "熄 0.2–0.5 盏"
    witness_drain: "-2 神智/秒（视野内有不可名状之物）"
    forbidden_book: "-20 神智（一次性，换符/知识）"
    forbidden_cast: "禁符任何时候可念；念出立即 −20 神智，下一次施法整次变为幻符（反噬）"
    phantom_cast_chance: 0.15
    phantom_slots: 1
    recovery: [香, 茶, 酒, 傩面, 静坐]
  rules:
    - 神智归零 = 入魔，不是死亡；入魔可逆，神智回到 ≥20 即出魔，但每次入魔留一道魔痕（见 possession）
    - 禁符任何时候可念；代价是 −20 神智 + 下一次施法反噬——力量导致疯狂，而非疯狂解锁力量
    - 禁符与幻符永不在同一次施法中出现（见 phantom_rules）
    - 神智只从四个来源流失：目睹、禁书、阴面、禁符；普通施法与违反规矩都不扣（docs/01-decision-twist.md D3）
    - 污染只遮蔽未知，不遮蔽已知：已学会的符名、法器属性、反应提示永不乱码
    - 原型顺序：M0 不做神智，M1 基础战斗成立后再加
    - 命格三选一：明面收益 + 暗面代价，暗面以谶语形式给一条提示
    - 命格会随污染变异（低神智时天赋变诅咒）
    - 元进度只解锁身份皮肤/托梦，不加数值
  phantom_rules:
    - 反噬：念出禁符后，下一次施法（下一次扣发）整次替换为 1 个幻符，消耗被替换那次施法的灵力；若那次施法本来含禁符，则禁符不生效、也不扣神智
    - 反噬期间法器上显示「污」印，玩家能看见下一发是幻符，可主动用一次便宜的施法把它「吃掉」
    - <33 的 15% 幻符替换：本次施法含禁符、或本次已是反噬幻符时不掷骰
    - 幻影符只占据不含禁符的符位
  possession:
    reference: 饥荒（Don't Starve）的理智系统——疯狂是可进出的状态；疯狂时影怪变实、会攻击，击杀它们回少量理智并掉落噩梦燃料
    enter: 神智归零
    exit: 神智回到 ≥ 20（滞回，避免在 0 附近反复进出）
    while_possessed:
      - 心魔化形：<33 时的幻觉敌人全部变实，会伤人，也能被杀
      - 击杀心魔：+10 神智，掉落「魇烬」（只有入魔时才能得到的粉末物质）
      - 阴物视你为同类：矿鬼等阴性敌人不主动攻击你（设计原文 1.4「部分族群停止攻击你」）
      - 失控：每 30 秒失控 1 秒，法器朝随机方向自动念一次；失控前 2 秒有心跳提示
      - 禁符：神智已空，−20 神智改由魄灯支付（熄 0.5 盏）；反噬照常
      - 香、茶、酒、静坐照常回复神智
    on_exit: 留一道「魔痕」——本局神智上限 −10，最多累计 −30；魔痕显示在三魂 UI 上
    yan_jin: 魇烬是沙盒材料而不是解锁钥匙：M1 与阴火一起进反应表（魇烬 + 火 → 阴火）
    later: 身体变异、阵营变化、入魔结局放到 M2 之后
  open_questions: [是否保留严格永久死亡, 入魔结局如何触发, 幻符池按层还是按敌人, 入魔效果清单（M1 计划定）, 角色差异是否只做表现层（机制分化推 EA 后）]
  design_ref: [1.4 三魂七魄, 1.8 元进度]
  what: 保留神智 0–100 三段阈值（≥66 / 33–65 / <33）与归零入魔；<33 在「地图消失、幻觉敌人」之外新增两条操作层代价（幻符替换、幻影符占位）；禁符规则反转为任何时候可念，念出 −20 神智，下一次施法整次反噬为幻符；禁符与幻符永不同在一次施法中。
  why: 原设计「神智 <33 才能念禁符」会让高手主动刷低神智，把惩罚变成 buff；新设计让代价落在操作层（念出的符、可用的符位）而非感知层；因果方向改为「力量导致疯狂」而非「疯狂解锁力量」。反噬放在「下一次」而不是「这一次」：若在同一次施法里替换符胆，禁符本身做符胆时会被幻符顶掉、永远放不出来；推迟一拍后代价可预测、可规划（批注 C11）。入魔给收益并不违背这一点：进入要付魔痕，收益是一种沙盒材料和阴物的中立，而不是最强符的使用权。
  cost: 失去「濒疯爆发窗口」的戏剧时刻；补偿为入魔仍保留，并改成可进出、有收益（魇烬、阴物不攻击）也有代价（心魔、失控、魔痕）的状态。反噬可以用一次便宜施法「垫掉」，代价因此比「本次必替换」轻，主要成本落在 −20 神智上。
  deviations:
    - 删除「神智 < 33 才能念禁符」（原 forbidden_threshold 33；设计原文 1.3）；改为随时可念 + −20 神智 + 下一次施法反噬为幻符。
    - 原定「该次施法必定触发一次幻符替换」改为「下一次施法整次反噬」：同次替换在禁符做符胆时会让禁符永远放不出来。
    - 失爽灵（33–65）由设计原文「符名变乱码、法器属性不可见」改为只腐坏未知信息（批注 C13；docs/01-decision-twist.md D3）。
    - <33 区段新增操作层代价：15% 幻符替换、1 格幻影符占位。
    - 入魔由设计原文的「另一条路线」改为可逆状态（参考饥荒理智系统）：神智归零入魔，回到 ≥20 出魔，每次入魔本局神智上限 −10（最多 −30）。理由：单向门等于资料片级内容（批注 C14），而可逆状态复用 <33 的幻觉敌人即可成立；魔痕防止反复刷入魔。变异、阵营、入魔结局推到 M2 之后。
    - 命格三选一推迟到 EA 后（见 docs/01-decision-twist.md）；本卡命格相关规则保留为 EA 设计参考。
  status: draft

- type: system
  id: S-0005
  name: 规矩 / 认知污染（关卡表现层）
  version: v0
  purpose: 把「规则怪谈式引导」做成关卡的叙事规则层：规矩靠文本给出、靠沙盒兑现，不另建系统（docs/01-decision-twist.md D2）。
  rules:
    - 每个区域 2–3 条规矩，用碑文/手札/矿工口述/游记残页给出，不给教程弹窗
    - 真规矩的后果必须是世界里看得见的事件——物质反应、物质涌出、实体出现；不直接扣神智或其他数值
    - 遵守/利用规矩 → 线索或密道；用符或物质验证规矩本身就是一次组合实验
    - 规则必须可发现、可推理、前后一致；不能随机坑人
    - 部分规矩本身是「假规矩」（村民骗你），需要交叉验证；biome.rules 用 type 标记真假
    - 需要独立状态机的规矩（违规计数、跨区规矩链）不做
    - 认知污染由神智驱动（S-0004）：只遮蔽未知，不遮蔽已知
  numbers:
    rules_per_area: 2–3
    violation_consequence: "取自反应表或实体生成（例：明火 → r-black-powder；子时应声 → 阴气涌出 + 追猎者）"
    ui_corruption: "<66 未鉴定物品描述、碑文、地图标记出现错字与假条目；<33 地图消失、幻觉敌人；已学会的符名/法器属性/反应提示永不乱码"
    discovery: [碑文, 手札, 矿工口述, 游记残页, 傩戏]
  open_questions: [假规矩占比, 「施法触发」反应类型何时补, 未鉴定物品的鉴定方式]
  design_ref: [1.4 三魂七魄, 2.5 人物（叙事手法）]
  what: 规矩从独立系统降为关卡的叙事规则层，只保留两种形态——(a) biome.rules 的真假混排提示文本；(b) 后果能用反应表或实体生成表达的硬规矩。
  why: 规矩的后果复用沙盒因果，不维护第二套规则引擎；验证规矩的手段（符 + 物质）就是主玩法的动词。设计原文本身没有规矩系统，规矩来自早期 brief。
  cost: 失去违规计数、追猎状态机、规矩链等设计空间；反应表没有的因果只能停在提示文本层。
  deviations:
    - 删除「违反规矩 → 神智 −10 ~ −30」：神智只从目睹、禁书、阴面、禁符四处流失（D3）；违规后果改为世界事件。
    - 删除「<66 符名乱码」：改为只腐坏未知信息（批注 C13）。
    - design_ref 去掉「1.5 阴阳两界」：阴面不进 MVP，与本卡无直接依赖。
  status: draft
