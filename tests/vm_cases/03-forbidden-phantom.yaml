cases:
  - id: VM-016
    title: 禁符：本次照常生效，−20 神智并置「下一次施法反噬」
    category: [forbidden_phantom]
    spec: "§2.7 第 5 步"
    initial:
      tick: 0
      sanity: 100
      backlash: false
      phantom_slots: []
      wand:
        spirit: 50
        spirit_max: 80
        regen_per_sec: 10
        slots: 2
        sentences_per_cast: 1
        recharge_ticks: 30
        ready_at_tick: 0
        ordered: true
        deck: [body-forbidden-wulei, null]
        cursor: 0
    input:
      op: cast
      rng: {phantom_roll: 1.0, phantom_slot: null, phantom_card: null}
    expect:
      accepted: true
      reject_reason: null
      actions:
        - op: spawn_projectile
          spell: body-forbidden-wulei
          damage: 60
          damage_type: 雷
          element: 雷
      consumed: [body-forbidden-wulei]
      spirit_after: 10
      sanity_after: 80
      backlash_after: true
      phantom_slots_after: []
      cursor_after: 0
      round_ended: true
      ready_at_tick_after: 30
      event_codes: [forbidden_read, backlash_armed, round_end]
      invariants:
        - action_count <= 64
        - spawn_count <= 32
        - sanity_after == 80
        - backlash_after == true

