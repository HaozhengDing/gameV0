# T1 符箓 VM 用例 04：触发递归与预算上限（VM-024 ~ VM-030）
# 上限建议值：深度 3 / 动作执行次数 64 / 投射物 32（spec §2.4、§7.2）。
schema: gamev0.vm_cases/v0.1
version: 0.1
updated: "2026-11-15"
spec: docs/tech/talisman-vm-spec.md
cases:
  - id: VM-024
    title: 敕·触基本递归：命中触发子句静态展开，共享游标
    category: [trigger]
    spec: "§2.3"
    initial:
      tick: 0
      sanity: 100
      backlash: false
      phantom_slots: []
      wand:
        spirit: 50
        spirit_max: 80
        regen_per_sec: 10
        slots: 4
        sentences_per_cast: 1
        recharge_ticks: 30
        ready_at_tick: 0
        ordered: true
        deck: [head-chu-touch, body-flying-sword, body-flying-sword, foot-sha]
        cursor: 0
    input:
      op: cast
      rng: {phantom_roll: 1.0, phantom_slot: null, phantom_card: null}
    expect:
      accepted: true
      reject_reason: null
      actions:
        - op: spawn_projectile
          spell: body-flying-sword
          damage: 8
          damage_type: 金
          element: 金
          pierce: 1
          trigger:
            kind: on_hit
            depth: 1
            actions:
              - op: spawn_projectile
                spell: body-flying-sword
                damage: 8
                damage_type: 金
                element: 金
                pierce: 1
                payloads:
                  - {op: explode, radius: 20, damage: 15, damage_type: 火}
      consumed: [head-chu-touch, body-flying-sword, body-flying-sword, foot-sha]
      spirit_after: 27
      sanity_after: 100
      backlash_after: false
      phantom_slots_after: []
      cursor_after: 0
      round_ended: true
      ready_at_tick_after: 30
      event_codes: [round_end]
      invariants:
        - action_count == 3
        - spawn_count == 2
        - max_depth == 1
        - spirit_after == 27

