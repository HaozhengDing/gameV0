version: 0.1
updated: "2026-11-15"
spec: docs/tech/talisman-vm-spec.md
cases:
  - id: VM-009
    title: 空符位与幻影符位被跳过：牌堆只剩两格可读
    category: [cursor, phantom_slot, foot_attach, forbidden_phantom]
    spec: "§1.2 §2.7"
    initial:
      tick: 0
      sanity: 20
      backlash: false
      phantom_slots: [1]
      wand:
        spirit: 50
        spirit_max: 80
        regen_per_sec: 10
        slots: 4
        sentences_per_cast: 2
        recharge_ticks: 30
        ready_at_tick: 0
        ordered: true
        deck: [body-flying-sword, foot-sha, body-bifang-huo, null]
        cursor: 0
    input:
      op: cast
      rng: {phantom_roll: 1.0, phantom_slot: null, phantom_card: null}
    expect:
      accepted: true
      reject_reason: null
      actions:
        - op: spawn_projectile
          spell: body-flying-sword
          damage: 8
          damage_type: 金
          element: 金
          pierce: 1
        - op: spawn_projectile
          spell: body-bifang-huo
          damage: 10
          damage_type: 火
          element: 火
          payloads:
            - {op: ignite, duration: 3, spread: true, damage_per_sec: 3}
      consumed: [body-flying-sword, body-bifang-huo]
      spirit_after: 35
      sanity_after: 20
      backlash_after: false
      phantom_slots_after: [1]
      cursor_after: 0
      round_ended: true
      ready_at_tick_after: 30
      event_codes: [round_end]
      invariants:
        - action_count <= 64
        - spawn_count <= 32
        - spawn_count == 2
        - phantom_slots_after == [1]

