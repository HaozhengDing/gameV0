cases:
  - id: VM-001
    title: 单符胆最小施法：飞剑一发，牌堆读尽触发回符
    category: [basic, cursor]
    spec: "§2.2"
    initial:
      tick: 0
      sanity: 100
      backlash: false
      phantom_slots: []
      wand:
        spirit: 50
        spirit_max: 80
        regen_per_sec: 10
        slots: 2
        sentences_per_cast: 1
        recharge_ticks: 30
        ready_at_tick: 0
        ordered: true
        deck: [body-flying-sword, null]
        cursor: 0
    input:
      op: cast
      rng: {phantom_roll: 1.0, phantom_slot: null, phantom_card: null}
    expect:
      accepted: true
      reject_reason: null
      actions:
        - op: spawn_projectile
          spell: body-flying-sword
          damage: 8
          damage_type: 金
          element: 金
          pierce: 1
      consumed: [body-flying-sword]
      spirit_after: 45
      sanity_after: 100
      backlash_after: false
      phantom_slots_after: []
      cursor_after: 0
      round_ended: true
      ready_at_tick_after: 30
      event_codes: [round_end]
      invariants:
        - action_count <= 64
        - spawn_count <= 32
        - max_depth <= 3
        - spirit_after >= 0
        - spawn_count == 1

